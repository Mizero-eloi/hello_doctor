<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelloDoctor USSD – Phone Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --phone-bg: #1a1a2e;
      --phone-frame: #16213e;
      --screen-bg: #0f0f1a;
      --screen-text: #e8e8ed;
      --screen-muted: #6b6b80;
      --key-bg: #2d2d44;
      --key-active: #4a4a6a;
      --accent: #00d4aa;
      --accent-dim: #00a884;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #0d0d14 0%, #1a1a2e 50%, #0d0d14 100%);
      color: var(--screen-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--screen-text);
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--screen-muted);
      margin-top: 0.25rem;
    }

    .phone {
      width: 360px;
      background: var(--phone-frame);
      border-radius: 42px;
      padding: 14px;
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.06),
        0 25px 50px -12px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .phone-screen {
      background: var(--screen-bg);
      border-radius: 28px;
      overflow: hidden;
      aspect-ratio: 9 / 19.5;
      max-height: 740px;
      min-height: 680px;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 11px;
      color: var(--screen-muted);
    }

    .ussd-display {
      flex: 1;
      min-height: 280px;
      padding: 16px 18px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--screen-text);
    }

    .ussd-display::-webkit-scrollbar {
      width: 4px;
    }

    .ussd-display::-webkit-scrollbar-thumb {
      background: var(--key-bg);
      border-radius: 2px;
    }

    .dial-prompt {
      padding: 10px 18px 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.2);
    }

    .dial-prompt label {
      display: block;
      font-size: 11px;
      color: var(--screen-muted);
      margin-bottom: 6px;
    }

    .dial-code {
      font-family: ui-monospace, monospace;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 22px 18px 28px;
      background: rgba(0,0,0,0.15);
    }

    .key {
      aspect-ratio: 1;
      background: var(--key-bg);
      border: none;
      border-radius: 50%;
      color: var(--screen-text);
      font-family: inherit;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .key:hover {
      background: var(--key-active);
      transform: scale(1.05);
    }

    .key:active {
      transform: scale(0.96);
    }

    .key.sub {
      font-size: 11px;
      color: var(--screen-muted);
    }

    .key.zero {
      grid-column: 2;
    }

    .key.hash {
      background: var(--accent);
      color: var(--screen-bg);
      font-size: 22px;
    }

    .key.hash:hover {
      background: var(--accent-dim);
    }

    .key.star {
      font-size: 22px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px 14px;
    }

    .input-row input {
      flex: 1;
      background: var(--key-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 16px;
      color: var(--screen-text);
      outline: none;
    }

    .input-row input::placeholder {
      color: var(--screen-muted);
    }

    .input-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0,212,170,0.2);
    }

    .input-row button {
      background: var(--accent);
      color: var(--screen-bg);
      border: none;
      border-radius: 14px;
      padding: 14px 26px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .input-row button:hover {
      background: var(--accent-dim);
      transform: scale(1.02);
    }

    .input-row button:active {
      transform: scale(0.98);
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--screen-muted);
      margin-top: 1rem;
      max-width: 360px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>HelloDoctor Telehealth</h1>
    <p>USSD phone simulator — dial *333# to start</p>
  </div>

  <div class="phone">
    <div class="phone-screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>● ● ●</span>
      </div>
      <div class="ussd-display" id="display">Dial *333# to start</div>
      <div class="dial-prompt">
        <label>Short code</label>
        <div class="dial-code" id="dialCode">*333#</div>
      </div>
      <div class="input-row">
        <input type="text" id="userInput" placeholder="Enter option or text" maxlength="100" autocomplete="off">
        <button type="button" id="sendBtn">Send</button>
      </div>
      <div class="keypad">
        <button type="button" class="key" data-value="1"><span>1</span></button>
        <button type="button" class="key" data-value="2"><span>2</span></button>
        <button type="button" class="key" data-value="3"><span>3</span></button>
        <button type="button" class="key" data-value="4"><span>4</span></button>
        <button type="button" class="key" data-value="5"><span>5</span></button>
        <button type="button" class="key" data-value="6"><span>6</span></button>
        <button type="button" class="key" data-value="7"><span>7</span></button>
        <button type="button" class="key" data-value="8"><span>8</span></button>
        <button type="button" class="key" data-value="9"><span>9</span></button>
        <button type="button" class="key star" data-value="*">*</button>
        <button type="button" class="key zero" data-value="0"><span>0</span></button>
        <button type="button" class="key hash" data-value="#">#</button>
      </div>
    </div>
  </div>

  <p class="hint">Use the keypad or type in the box and press Send. Option 0 usually goes back.</p>

  <script>
    (function () {
      const display = document.getElementById('display');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const keys = document.querySelectorAll('.key[data-value]');

      let sessionId = null;
      let dialed = false;

      function apiUrl() {
        const base = window.location.origin;
        return base + '/api/ussd';
      }

      function setDisplay(text) {
        display.textContent = text || '';
        display.scrollTop = display.scrollHeight;
      }

      function sendInput(value) {
        const isInitialDial = !dialed;
        if (isInitialDial) dialed = true;

        const payload = { sessionId: sessionId || 'sim-' + Date.now() };
        if (!isInitialDial) payload.input = String(value ?? userInput.value).trim();

        fetch(apiUrl(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.sessionId) sessionId = data.sessionId;
            setDisplay(data.text || 'No response.');
            userInput.value = '';
            if (data.end) {
              sessionId = null;
              dialed = false;
              setTimeout(() => {
                setDisplay('Dial *333# to start again.');
              }, 100);
            }
          })
          .catch((err) => {
            setDisplay('Error: Is the server running? Run "npm run simulator" and open http://localhost:3333');
            console.error(err);
          });
      }

      function onDial() {
        if (!dialed) {
          sendInput('');
        }
      }

      sendBtn.addEventListener('click', () => {
        if (!dialed) {
          onDial();
        } else {
          sendInput(userInput.value.trim());
        }
      });

      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendBtn.click();
        }
      });

      keys.forEach((key) => {
        key.addEventListener('click', () => {
          const v = key.getAttribute('data-value');
          if (v === '#') {
            if (!dialed) onDial();
            else sendInput(userInput.value.trim() || ' ');
            return;
          }
          if (v === '*') {
            userInput.value += '*';
            return;
          }
          userInput.value += v;
        });
      });

      document.getElementById('dialCode').addEventListener('click', onDial);
    })();
  </script>
</body>
</html>
